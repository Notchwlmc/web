<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>欢迎回来 - 赣一神人会</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { min-height: 200vh; }
        .hero {
            position: relative; z-index: 10;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; pointer-events: none;
        }
        .hero h1 { font-size: 5rem; font-weight: 700; letter-spacing: 4px; margin-bottom: 12px; color: #fff; text-shadow: 4px 4px 0px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.6); }
        .hero p { font-size: 1.2rem; color: #ddd; font-weight: 700; letter-spacing: 2px; text-shadow: 2px 2px 0px rgba(0,0,0,0.8); }

        .glass-card { max-width: 800px; width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 50px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-top: 40px; }
        .glass-card h2 { font-size: 2.5rem; color: #25e6c5; margin-bottom: 24px; font-weight: 700; text-shadow: 0 0 20px rgba(37, 230, 197, 0.4); }
        .glass-card p { font-size: 1.1rem; color: #aaa; line-height: 1.8; margin-bottom: 16px; font-weight: 700; }

        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%; max-width: 800px; margin: 40px auto; align-items: start; }
        .feature-card, .special-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 30px; text-align: center; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .feature-icon { font-size: 1rem; margin-bottom: 15px; }
        .feature-card h3 { font-size: 1.2rem; color: #fff; margin-bottom: 10px; font-weight: 700; }
        .feature-card p { font-size: 0.9rem; color: #888; line-height: 1.6; font-weight: 700; }

        .special-card h3, .special-card p { font-weight: 700; letter-spacing: 1px; background: linear-gradient(to right, #ff0055, #ffaa00, #00ffaa, #00aaff, #aa00ff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: text-rainbow 3s linear infinite; }
        .special-card h3 { font-size: 1.2rem; margin-bottom: 10px; }
        .special-card p { font-size: 0.9rem; margin-bottom: 10px; }
        @keyframes text-rainbow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .card-link { display: block; width: 100%; cursor: pointer; }

        @media (hover: hover) and (pointer: fine) {
            .feature-card:hover, .special-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-5px); }
            .card-link:hover { border-color: rgba(37, 230, 197, 0.5); transform: translateY(-5px); }
        }
        @media (max-width: 768px) {
            .hero h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); letter-spacing: 2px; }
            .glass-card { padding: 30px; }
        }
        @media (max-width: 480px) {
            .features-grid { grid-template-columns: 1fr; gap: 16px; }
            .glass-card { padding: 24px 20px; }
            .glass-card h2 { font-size: 1.8rem; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<div class="vignette"></div>
<div id="nav-placeholder"></div>

<div class="hero">
    <h1>欢迎回来</h1>
    <p>赣一中的神人们</p>
</div>

<div class="content-section">
    <div class="glass-card">
        <h2>服务器简介</h2>
        <p>欢迎想变成神人的人加入！此服务器为原版生存服务器，你可以在这里尽情给腐竹打工。</p>
        <p>享受当黑奴的快乐!</p>
    </div>

    <div class="features-grid">
        <div class="feature-card">
            <div class="feature-icon">️</div>
            <h3>硬核生存</h3>
            <p>内有自研Resdence和PubliicTP,为你的生存之旅保驾护航。</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">️</div>
            <h3>粘液科技</h3>
            <p>高度自由的自动化流水线，从基础挖矿到全自动农场，体验工业时代的魅力。</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon"></div>
            <h3>自由社交</h3>
            <p>结交志同道合的伙伴，绑定你们的专属关系</p>
        </div>
        <a href="https://ciallo.cc/" class="card-link" target="_blank">
            <div class="special-card">
                <div class="feature-icon"></div>
                <h3>腐竹是香香软软的小南梁</h3>
                <p>腐竹正在Ciallo～ (∠・ω< )⌒★</p>
            </div>
        </a>
    </div>
    <div id="footer-placeholder"></div>
</div>

<script src="common.js"></script>
<script>
    document.getElementById('nav-placeholder').outerHTML = getCommonNavHTML('赣一神人会', 'GANYI GODS CLUB');
    document.getElementById('footer-placeholder').outerHTML = getCommonFooterHTML();
</script>
</body>
</html>
