<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>插件详情 - 赣一神人会</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .container { width: 100%; max-width: 1000px; flex: 1; }
        .breadcrumb { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
        .breadcrumb span { color: #25e6c5; }

        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 40px; margin-bottom: 30px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .plugin-header { display: flex; gap: 24px; align-items: flex-start; }
        .plugin-icon { width: 80px; height: 80px; flex-shrink: 0; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(37, 230, 197, 0.3); border-radius: 16px; margin-right: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 20px rgba(37, 230, 197, 0.2); }
        .plugin-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .plugin-info h1 { font-size: 2.2rem; color: #fff; margin-bottom: 12px; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .plugin-meta { color: #aaa; font-size: 0.95rem; display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .tag { background: rgba(37, 230, 197, 0.1); border: 1px solid rgba(37, 230, 197, 0.2); color: #25e6c5; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; }

        .action-bar { display: flex; gap: 15px; margin-top: 24px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; transition: all 0.3s; }
        .btn-primary { background-color: #25e6c5; color: #000; box-shadow: 0 5px 15px rgba(37, 230, 197, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 230, 197, 0.5); }
        .btn-outline { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
        .btn-outline:hover { border-color: #25e6c5; color: #25e6c5; background: rgba(37, 230, 197, 0.05); }

        .stats-row { display: flex; justify-content: space-around; text-align: center; margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .stat-item h3 { font-size: 1.8rem; color: #25e6c5; margin-bottom: 5px; text-shadow: 0 0 15px rgba(37, 230, 197, 0.4); }
        .stat-item p { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        .content-section h2 { font-size: 1.5rem; margin-bottom: 20px; color: #fff; border-left: 4px solid #25e6c5; padding-left: 15px; }
        .content-text { color: #ccc; font-size: 1.05rem; line-height: 1.8; }
        .content-text p { margin-bottom: 15px; }
        .feature-list { list-style: none; }
        .feature-list li { margin-bottom: 10px; position: relative; padding-left: 20px; }
        .feature-list li::before { content: "\2022"; color: #25e6c5; position: absolute; left: 0; font-weight: bold; font-size: 1.2rem; top: -2px; }

        @media (max-width: 768px) {
            .glass-card { padding: 24px; border-radius: 16px; }
            .plugin-header { flex-direction: column; align-items: center; text-align: center; }
            .plugin-icon { margin-right: 0; margin-bottom: 20px; width: 100px; height: 100px; }
            .plugin-info h1 { font-size: 1.8rem; }
            .plugin-meta { justify-content: center; }
            .action-bar { justify-content: center; width: 100%; }
            .btn { width: 100%; justify-content: center; }
            .stats-row { flex-direction: column; gap: 20px; }
            .content-section h2 { font-size: 1.3rem; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<div class="vignette"></div>
<div id="nav-placeholder"></div>

<div class="content-section">
    <div class="container">
        <div class="breadcrumb">
            首页 / 资源中心 / <span id="bc-platform">Bukkit/Spigot</span> / <span id="bc-current">插件</span>
        </div>

        <div class="glass-card">
            <div class="plugin-header">
                <div class="plugin-icon"><img src="./PublicTP.png" alt=""></div>
                <div class="plugin-info" style="flex:1">
                    <h1 id="p-title">PubllicTP</h1>
                    <div class="plugin-meta">
                        <span id="p-author">作者: Notchwlmc</span>
                        <span id="p-version">版本: 1.0.0</span>
                        <span class="tag" id="p-platform">1.21.x</span>
                    </div>
                    <p style="color:#aaa; font-size:0.95rem;" id="p-short">A plugin can record locations and share to everyone.</p>
                    <div class="action-bar">
                        <button class="btn btn-primary"><span class="material-icons">cloud_download</span> 立即下载</button>
                        <button class="btn btn-outline"><span class="material-icons">description</span> 查看源码</button>
                    </div>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-item"><h3 id="p-downloads">0</h3><p>累计下载</p></div>
                <div class="stat-item"><h3 id="p-score">-</h3><p>用户评分</p></div>
                <div class="stat-item"><h3 id="p-updated">-</h3><p>最后更新</p></div>
            </div>
        </div>

        <div class="glass-card">
            <h2>插件介绍</h2>
            <div class="content-text" id="p-intro">
                <p>这是一个可以记录玩家坐标并分享给全服玩家的插件。</p>
                <ul class="feature-list">
                    <li>支持自定义记录点</li>
                    <li>支持权限节点控制</li>
                </ul>
            </div>
        </div>

        <div class="glass-card" id="config-card">
            <h2>配置教程</h2>
            <div class="content-text" id="p-config">
                <p>下载后放入 plugins 文件夹，重启服务器即可生成配置文件。</p>
            </div>
        </div>
    </div>
    <div id="footer-placeholder"></div>
</div>

<script src="common.js"></script>
<script>
    document.getElementById('nav-placeholder').outerHTML = getCommonNavHTML('插件详情', 'GANYI RESOURCES');
    document.getElementById('footer-placeholder').outerHTML = getCommonFooterHTML();
    initUI();
</script>
<script src="script.js"></script>
</body>
</html>
