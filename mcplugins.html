<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MCPlugins - 赣一神人会</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-container { width: 100%; max-width: 1000px; flex: 1; }
        .search-header { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 30px; margin-bottom: 30px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .search-header h2 { font-size: 1.5rem; margin-bottom: 20px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .search-box { display: flex; gap: 15px; }
        input[type="text"] { flex: 1; padding: 14px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background-color: rgba(0, 0, 0, 0.3); color: white; outline: none; font-size: 1rem; transition: all 0.3s; }
        input[type="text"]:focus { border-color: #25e6c5; box-shadow: 0 0 15px rgba(37, 230, 197, 0.2); background-color: rgba(0, 0, 0, 0.5); }
        button.search-btn { padding: 0 30px; background-color: #25e6c5; color: #000; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem; white-space: nowrap; transition: all 0.3s; }
        button.search-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 230, 197, 0.4); }
        #content-area { width: 100%; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .plugin-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 24px; border-radius: 16px; margin-bottom: 20px; display: flex; align-items: center; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .plugin-card:hover { transform: translateY(-5px); border-color: rgba(37, 230, 197, 0.5); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(37, 230, 197, 0.1); background: rgba(255, 255, 255, 0.06); }
        .card-icon { width: 64px; height: 64px; flex-shrink: 0; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; margin-right: 24px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #25e6c5; }
        .card-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info h3 { font-size: 1.25rem; color: #fff; margin-bottom: 8px; }
        .card-info p { color: #aaa; font-size: 0.95rem; margin-bottom: 12px; line-height: 1.5; }
        .tags span { background-color: rgba(37, 230, 197, 0.1); border: 1px solid rgba(37, 230, 197, 0.2); color: #25e6c5; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; margin-right: 8px; display: inline-block; margin-bottom: 6px; }

        .home-stats { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px; flex: 1; min-width: 200px; border-radius: 16px; text-align: center; }
        .stat-card h3 { font-size: 2.5rem; color: #25e6c5; text-shadow: 0 0 20px rgba(37, 230, 197, 0.4); margin-bottom: 8px; }
        .stat-card p { color: #aaa; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        .loading { text-align: center; padding: 50px; color: #25e6c5; font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spin-icon { animation: spin 1s linear infinite; }

        @media (max-width: 768px) {
            .search-header { padding: 20px; }
            .search-box { flex-direction: column; }
            button.search-btn { padding: 14px; }
            .plugin-card { padding: 16px; flex-direction: column; align-items: flex-start; }
            .card-icon { width: 48px; height: 48px; margin-right: 0; margin-bottom: 15px; }
            .card-info h3 { font-size: 1.15rem; }
            .card-info p { font-size: 0.85rem; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

            </button>
            <div id="settingsPanel" class="settings-panel">

        <div class="status-badge" id="ipBadge" title="点击复制服务器IP">
            <div class="dot"></div>
            <span id="ipText">IP:mc.notchwlmc.us.ci</span>

    </div>

<script src="common.js"></script>
<script>
    initUI();

    const pages = {
        'home': `
            <h2 style="margin-bottom: 10px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">欢迎来到资源中心</h2>
            <p style="color: #aaa; line-height: 1.6;">这里是最新更新的服务器资源统计。</p>
            <div class="home-stats">
                <div class="stat-card"><h3>2</h3><p>收录插件总数</p></div>
                <div class="stat-card"><h3>0</h3><p>累计下载量</p></div>
            </div>
        `,
        'plugins': `
            <a href="plugins-detail.html" style="text-decoration: none; color: inherit; display: block;">
                <div class="plugin-card">
                    <div class="card-icon"><img src="./PublicTP.png" alt=""></div>
                    <div class="card-info">
                        <h3>PublicTP</h3>
                        <p>A plugin can record locations and share to everyone.</p>
                        <div class="tags"><span>Bukkit</span><span>Spigot</span><span>1.21.x</span></div>
                    </div>
                </div>
            </a>
            <div class="plugin-card">
                <div class="card-icon"><img src="./Ramchecker.png" alt=""></div>
                <div class="card-info">
                    <h3>Ramchecker</h3>
                    <p>Can monitor server memory usage, and restart the server when it exceeds the threshold</p>
                    <div class="tags"><span>Paper</span><span>1.21.x</span></div>
                </div>
            </div>
        `,
        'mods': `
            <div class="loading"><i class="material-icons spin-icon" style="font-size: 40px;">autorenew</i><span>模组正在开发中...</span></div>
        `
    };

    window.loadPage = function(pageName, element) {
        const contentDiv = document.getElementById('content-area');
        contentDiv.innerHTML = `<div class="loading"><i class="material-icons spin-icon" style="font-size: 40px;">autorenew</i><span>正在加载数据...</span></div>`;

        setTimeout(() => {
            if(pages[pageName]) {
                contentDiv.innerHTML = pages[pageName];
                contentDiv.style.animation = 'none'; contentDiv.offsetHeight; contentDiv.style.animation = 'fadeIn 0.4s ease-out';
            } else {
                contentDiv.innerHTML = '<h2 style="color: #ff5555;">404 页面未找到</h2>';
            }
        }, 300);

        document.querySelectorAll('.nav-menu li a').forEach(item => item.classList.remove('active'));
        if (element) { element.classList.add('active'); }

        document.getElementById('menuBtn').classList.remove('active');
        document.getElementById('navMenu').classList.remove('show');
    };

    window.onload = function() {
        const contentDiv = document.getElementById('content-area');
        if(pages['home']) { contentDiv.innerHTML = pages['home']; }
    };
</script>
