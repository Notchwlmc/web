<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MCPlugins - 赣一神人会</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Minecraft AE';
            src: url('./MinecraftAE-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Minecraft AE', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        body {
            background-color: #000; color: #fff;
            overflow-x: hidden;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            overscroll-behavior-y: contain;
        }

        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            transition: filter 0.3s ease;
            filter: blur(10px);
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 2; pointer-events: none;
        }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 1000;
            background: rgba(15, 15, 20, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: background 0.4s ease;
        }
        .navbar.scrolled { background: rgba(10, 10, 15, 0.85); }

        .navbar::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.15) 20%, rgba(37, 230, 197, 0.4) 50%, rgba(255, 255, 255, 0.15) 80%, transparent 100%);
        }

        .nav-left { display: flex; align-items: center; gap: 16px; position: relative; min-width: 0; }

        .menu-btn {
            position: relative; display: flex; justify-content: center; align-items: center;
            width: 42px; height: 42px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; cursor: pointer;
            backdrop-filter: blur(5px); transition: all 0.3s ease;
            -webkit-appearance: none; appearance: none;
        }

        .menu-btn span {
            position: absolute; left: 50%; top: 50%; width: 18px; height: 2px;
            background-color: #25e6c5; border-radius: 2px; margin-left: -9px; margin-top: -1px;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: block;
        }
        .menu-btn span:nth-child(1) { transform: translateY(-6px); }
        .menu-btn span:nth-child(2) { transform: translateY(0); }
        .menu-btn span:nth-child(3) { transform: translateY(6px); }
        .menu-btn.active span:nth-child(1) { transform: rotate(45deg) translateY(0); }
        .menu-btn.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translateY(0); }

        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
        
        .logo-text-group {
            display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; overflow: hidden;
        }
        .logo-text-cn {
            display: flex; flex-direction: column; justify-content: center; line-height: 1.1;
            white-space: nowrap; font-size: 1.3rem; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .logo-text-en {
            display: flex; flex-direction: column; justify-content: center; line-height: 1.1;
            white-space: nowrap; font-size: 0.65rem; color: #ddd; letter-spacing: 0.5px;
            text-transform: uppercase; margin-top: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .logo-dot { width: 10px; height: 10px; background: #25e6c5; border-radius: 50%; box-shadow: 0 0 10px #25e6c5; animation: pulse 2s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(37, 230, 197, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(37, 230, 197, 0); } }

        .nav-menu {
            position: absolute; top: 50px; left: 0; width: 180px;
            background: rgba(15, 15, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 10px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            isolation: isolate; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .nav-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .nav-menu ul { list-style: none; }
        .nav-menu li a {
            display: flex; align-items: center; gap: 10px; padding: 12px 16px; text-decoration: none; color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem; border-radius: 8px; transition: background 0.2s, color 0.2s; cursor: pointer;
        }
        .nav-menu li a:hover { background: rgba(255, 255, 255, 0.1); color: #25e6c5; }
        .nav-menu li a.active { color: #25e6c5; background: rgba(37, 230, 197, 0.1); }

        .nav-controls { display: flex; align-items: center; gap: 16px; position: relative; min-width: 0; }
        .settings-wrapper { position: relative; flex-shrink: 0; }

        .gear-btn {
            display: flex; justify-content: center; align-items: center; width: 42px; height: 42px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; color: #25e6c5; cursor: pointer; backdrop-filter: blur(5px);
            transition: all 0.3s ease; -webkit-appearance: none; appearance: none;
        }
        .gear-btn svg { width: 20px; height: 20px; fill: currentColor; display: block; flex-shrink: 0; max-width: 100%; }

        .settings-panel {
            position: absolute; top: 55px; right: 0; width: 240px;
            background: rgba(15, 15, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            isolation: isolate; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .settings-panel.show { opacity: 1; visibility: visible; transform: translateY(0); }

        .setting-item { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .setting-item:last-child { margin-bottom: 0; }
        .setting-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #ccc; }

        input[type=range] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 28px;
            background: transparent; cursor: pointer; margin: 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #25e6c5; margin-top: -7px; box-shadow: 0 0 8px rgba(37, 230, 197, 0.8); transition: transform 0.1s;
        }

        .status-badge {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; font-size: 0.85rem; color: #eee; backdrop-filter: blur(5px);
            cursor: pointer; user-select: none; transition: background-color 0.3s ease, border-color 0.3s ease;
            min-width: 0; flex-shrink: 1;
        }
        .status-badge .dot { width: 6px; height: 6px; background: #25e6c5; border-radius: 50%; transition: background 0.3s; flex-shrink: 0; }
        .status-badge #ipText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .status-badge.copied { border-color: #25e6c5; background: rgba(37, 230, 197, 0.15); }
        .status-badge.copied #ipText { color: #25e6c5; }

        .content-section {
            position: relative; z-index: 10;
            min-height: 100vh; min-height: 100dvh;
            padding: 120px 40px 60px;
            background: rgba(10, 10, 15, 0.85);
            display: flex; flex-direction: column; align-items: center;
        }

        .main-container { width: 100%; max-width: 1000px; flex: 1; }

        .search-header {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 30px; margin-bottom: 30px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .search-header h2 {
            font-size: 1.5rem; margin-bottom: 20px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-box { display: flex; gap: 15px; }

        input[type="text"] {
            flex: 1; padding: 14px 20px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); background-color: rgba(0, 0, 0, 0.3);
            color: white; outline: none; font-size: 1rem; transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: #25e6c5; box-shadow: 0 0 15px rgba(37, 230, 197, 0.2); background-color: rgba(0, 0, 0, 0.5);
        }

        button.search-btn {
            padding: 0 30px; background-color: #25e6c5; color: #000;
            border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem;
            white-space: nowrap; transition: all 0.3s;
        }
        button.search-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 230, 197, 0.4); }

        #content-area { width: 100%; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .plugin-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px; border-radius: 16px; margin-bottom: 20px;
            display: flex; align-items: center;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .plugin-card:hover {
            transform: translateY(-5px); border-color: rgba(37, 230, 197, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(37, 230, 197, 0.1);
            background: rgba(255, 255, 255, 0.06);
        }

        .card-icon {
            width: 64px; height: 64px; flex-shrink: 0;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px; margin-right: 24px;
            display: flex; align-items: center; justify-content: center; overflow: hidden; color: #25e6c5;
        }
        .card-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-info h3 { font-size: 1.25rem; color: #fff; margin-bottom: 8px; }
        .card-info p { color: #aaa; font-size: 0.95rem; margin-bottom: 12px; line-height: 1.5; }

        .tags span {
            background-color: rgba(37, 230, 197, 0.1); border: 1px solid rgba(37, 230, 197, 0.2);
            color: #25e6c5; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem;
            margin-right: 8px; display: inline-block; margin-bottom: 6px;
        }

        .home-stats { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px; flex: 1; min-width: 200px; border-radius: 16px; text-align: center;
        }
        .stat-card h3 { font-size: 2.5rem; color: #25e6c5; text-shadow: 0 0 20px rgba(37, 230, 197, 0.4); margin-bottom: 8px; }
        .stat-card p { color: #aaa; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }

        .loading { text-align: center; padding: 50px; color: #25e6c5; font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spin-icon { animation: spin 1s linear infinite; }

        .footer {
            margin-top: 60px; display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 16px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            width: 100%; max-width: 1000px;
        }

        .footer p { font-size: 0.9rem; color: #666; letter-spacing: 1px; text-transform: uppercase; }

        .github-link, .qq-link {
            display: flex; justify-content: center; align-items: center;
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888; text-decoration: none; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            flex-shrink: 0;
        }

        .github-link svg { width: 24px; height: 24px; fill: currentColor; display: block; flex-shrink: 0; max-width: 100%; }
        .qq-link svg { width: 24px !important; height: 24px !important; fill: rgba(255, 255, 255, 0.5); display: block; flex-shrink: 0; max-width: 100%; }

        @media (hover: hover) and (pointer: fine) {
            .menu-btn:hover { background: rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.25); }
            .gear-btn:hover { background: rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.25); transform: rotate(90deg); }
            .status-badge:hover {
                color: #fff; background: rgba(37, 230, 197, 0.15);
                border-color: rgba(37, 230, 197, 0.5); box-shadow: 0 5px 15px rgba(37, 230, 197, 0.3);
            }
            .github-link:hover, .qq-link:hover {
                color: #fff; background: rgba(37, 230, 197, 0.15);
                border-color: rgba(37, 230, 197, 0.5); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(37, 230, 197, 0.3);
            }
        }

        @media (max-width: 768px) {
            .navbar { padding: 0 12px; padding-top: env(safe-area-inset-top); height: auto; min-height: 64px; gap: 10px; }
            .nav-left { gap: 8px; min-width: 0; flex-shrink: 1; }
            .nav-controls { gap: 8px; flex-shrink: 0; }
            .menu-btn, .gear-btn { width: 38px; height: 38px; }
            .logo { gap: 8px; }
            .logo-text-cn { font-size: 1rem; }
            .logo-text-en { font-size: 0.5rem; margin-top: 0; }
            .logo-dot { width: 8px; height: 8px; }
            .status-badge { max-width: 130px; padding: 6px 10px; font-size: 0.75rem; flex-shrink: 1; }
            .content-section { padding: calc(100px + env(safe-area-inset-top)) 15px 40px; }
            .search-header { padding: 20px; }
            .search-box { flex-direction: column; }
            button.search-btn { padding: 14px; }
            .plugin-card { padding: 16px; flex-direction: column; align-items: flex-start; }
            .card-icon { width: 48px; height: 48px; margin-right: 0; margin-bottom: 15px; }
            .card-info h3 { font-size: 1.15rem; }
            .card-info p { font-size: 0.85rem; }
        }

        @media (max-width: 480px) {
            .footer { flex-direction: column; gap: 20px; }
            .footer p { font-size: 0.8rem; text-align: center; word-break: break-word; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

</div>

<script>
    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); }, false);

    const textureLoader = new THREE.TextureLoader();
    function loadPanorama(url) {
        const tex = textureLoader.load(url);
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false; tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
    }

    const materials = [
        new THREE.MeshBasicMaterial({ map: loadPanorama('panorama_1.png') }),
        new THREE.MeshBasicMaterial({ map: loadPanorama('panorama_3.png') }),
        new THREE.MeshBasicMaterial({ map: loadPanorama('panorama_4.png') }),
        new THREE.MeshBasicMaterial({ map: loadPanorama('panorama_5.png') }),
        new THREE.MeshBasicMaterial({ map: loadPanorama('panorama_0.png') }),
        new THREE.MeshBasicMaterial({ map: loadPanorama('panorama_2.png') })
    ];

    scene.background = new THREE.Color(0x0a0a0f);
    const geometry = new THREE.BoxGeometry(2000, 2000, 2000);
    materials.forEach(mat => { mat.side = THREE.BackSide; });

    const skybox = new THREE.Mesh(geometry, materials);
    scene.add(skybox);

    let currentSpeedMultiplier = 1;
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        
        time += 0.001 * currentSpeedMultiplier;
        
        camera.rotation.x = -0.05 + Math.sin(time * 0.5) * 0.02;
        camera.rotation.y = Math.sin(time * 0.3) * 0.05;
        
        skybox.rotation.y -= 0.0002 * currentSpeedMultiplier;
        
        renderer.render(scene, camera);
    }
    animate();

    let resizeRaf = null;
    function updateSize() {
        const w = window.innerWidth; const h = window.innerHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix();
        renderer.setSize(w, h); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }
    function scheduleResize() {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(updateSize);
    }

    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', scheduleResize);
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', scheduleResize); }

    const navbar = document.getElementById('navbar');
    const menuBtn = document.getElementById('menuBtn');
    const navMenu = document.getElementById('navMenu');
    const gearBtn = document.getElementById('gearBtn');
    const settingsPanel = document.getElementById('settingsPanel');

    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) { navbar.classList.add('scrolled'); } else { navbar.classList.remove('scrolled'); }
    });

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuBtn.classList.toggle('active');
        navMenu.classList.toggle('show');
        settingsPanel.classList.remove('show');
    });

    gearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanel.classList.toggle('show');
        menuBtn.classList.remove('active');
        navMenu.classList.remove('show');
    });

    document.addEventListener('click', (e) => {
        if (!navMenu.contains(e.target) && e.target !== menuBtn) {
            menuBtn.classList.remove('active');
            navMenu.classList.remove('show');
        }
        if (!settingsPanel.contains(e.target) && e.target !== gearBtn) {
            settingsPanel.classList.remove('show');
        }
    });

    navMenu.addEventListener('click', (e) => e.stopPropagation());
    settingsPanel.addEventListener('click', (e) => e.stopPropagation());

    const blurSlider = document.getElementById('blurSlider');
    const blurVal = document.getElementById('blurVal');
    let blurRaf = null;
    blurSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        blurVal.textContent = `${val}px`;
        if (blurRaf) cancelAnimationFrame(blurRaf);
        blurRaf = requestAnimationFrame(() => {
            container.style.filter = val === '0' ? 'none' : `blur(${val}px)`;
        });
    });

    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    speedSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        currentSpeedMultiplier = val;
        speedVal.textContent = `${val.toFixed(1)}x`;
    });

    const ipBadge = document.getElementById('ipBadge');
    const ipText = document.getElementById('ipText');
    const ipAddress = 'mc.notchwlmc.us.ci';

    async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
        }
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:none;outline:none;box-shadow:none;background:transparent;opacity:0;font-size:16px;';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    ipBadge.addEventListener('click', async () => {
        ipBadge.classList.remove('animate'); void ipBadge.offsetWidth; ipBadge.classList.add('animate');
        const ok = await copyText(ipAddress);
        if (!ok) {
            ipText.textContent = '复制失败';
            setTimeout(() => { ipText.textContent = `IP:${ipAddress}`; }, 2000);
            return;
        }
        ipText.textContent = '已复制!'; ipBadge.classList.add('copied');
        setTimeout(() => { ipText.textContent = `IP:${ipAddress}`; ipBadge.classList.remove('copied'); }, 2000);
    });

    const pages = {
        'home': `
            <h2 style="margin-bottom: 10px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">欢迎来到资源中心</h2>
            <p style="color: #aaa; line-height: 1.6;">这里是最新更新的服务器资源统计。</p>
            <div class="home-stats">
                <div class="stat-card">
                    <h3>2</h3><p>收录插件总数</p>
                </div>
                <div class="stat-card">
                    <h3>0</h3><p>累计下载量</p>
                </div>
            </div>
        `,
        'plugins': `
            <a href="plugins-detail.html" style="text-decoration: none; color: inherit; display: block;">
                <div class="plugin-card">
                    <div class="card-icon"><img src="./PublicTP.png" alt=""></div>
                    <div class="card-info">
                        <h3>PublicTP</h3>
                        <p>A plugin can record locations and share to everyone.</p>
                        <div class="tags"><span>Bukkit</span><span>Spigot</span><span>1.21.x</span></div>
                    </div>
                </div>
            </a>
            <div class="plugin-card">
                <div class="card-icon"><img src="./Ramchecker.png" alt=""></div>
                <div class="card-info">
                    <h3>Ramchecker</h3>
                    <p>Can monitor server memory usage, and restart the server when it exceeds the threshold</p>
                    <div class="tags"><span>Paper</span><span>1.21.x</span></div>
                </div>
            </div>
        `,
        'mods': `
            <div class="loading">
                <i class="material-icons spin-icon" style="font-size: 40px;">autorenew</i>
                <span>模组正在开发中...</span>
            </div>
        `,
    };

    function loadPage(pageName, element) {
        const contentDiv = document.getElementById('content-area');
        contentDiv.innerHTML = `
            <div class="loading">
                <i class="material-icons spin-icon" style="font-size: 40px;">autorenew</i>
                <span>正在加载数据...</span>
            </div>
        `;

        setTimeout(() => {
            if(pages[pageName]) {
                contentDiv.innerHTML = pages[pageName];
                contentDiv.style.animation = 'none'; contentDiv.offsetHeight; contentDiv.style.animation = 'fadeIn 0.4s ease-out';
            } else {
                contentDiv.innerHTML = '<h2 style="color: #ff5555;">404 页面未找到</h2>';
            }
        }, 300);

        document.querySelectorAll('.nav-menu li a').forEach(item => {
            item.classList.remove('active');
        });
        if (element) { element.classList.add('active'); }

        menuBtn.classList.remove('active');
        navMenu.classList.remove('show');
    }

    window.onload = function() {
        const contentDiv = document.getElementById('content-area');
        if(pages['home']) { contentDiv.innerHTML = pages['home']; }
    };
</script>
</body>
